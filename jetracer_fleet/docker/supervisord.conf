[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:api]
command=/opt/venv/bin/rmf_api_server
priority=10
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rmf]
command=ros2 launch jetracer_fleet jetracer_rmf_core.launch.xml headless:=true server_uri:=ws://127.0.0.1:8000/_internal
priority=20
autostart=true
autorestart=true
startsecs=2
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:adapter]
command=ros2 launch jetracer_fleet jetracer_fleet_adapter.launch.xml server_uri:=ws://127.0.0.1:8000/_internal zenoh_config:=/run/jetracer/zenoh.json5 config_file:=/run/jetracer/fleet.yaml
priority=30
autostart=true
autorestart=true
startsecs=2
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
